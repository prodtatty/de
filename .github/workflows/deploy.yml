name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/cinematic-scroll-video-site-g0hxfr, claude/compassionate-euler-zxmal9, claude/beautiful-hamilton-iz8inm]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            veranda/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The ВЕРАНДА coffee-shop site is a separate app, served at /veranda/.
      - name: Build Veranda
        if: hashFiles('veranda/package.json') != ''
        working-directory: veranda
        run: |
          npm ci
          npm run build
          cp -r dist ../dist/veranda

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
